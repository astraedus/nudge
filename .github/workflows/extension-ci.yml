name: Extension CI

# The Chrome extension (extension/) is a separate product from the Android app and has its
# own pipeline. The Android workflow (release.yml) carries the mirror-image
# `paths-ignore: ['extension/**']` so the two never trigger each other.

on:
  push:
    branches:
      - main
    paths:
      - 'extension/**'
      - '.github/workflows/extension-ci.yml'
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/extension-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: extension

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Store validity is invisible to lint/tsc/vitest/build, the extension shipped with no
      # icons key and an over-length description while all of those were green. Checks the
      # BUILT manifest, because WXT auto-discovers icons and they appear in no source file.
      - name: Verify the built manifest is Chrome Web Store valid
        run: npm run verify:manifest

      # The loadable artifact, so a failing e2e run can be reproduced against the exact
      # build that failed.
      - name: Upload built extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nudge-extension-chrome-mv3
          path: extension/.output/chrome-mv3
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright e2e
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      # Chrome loads extensions only in a HEADFUL persistent context, so the suite runs
      # under a virtual display rather than headless.
      - name: Run e2e under xvfb
        run: xvfb-run -a npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: extension/playwright-report
          if-no-files-found: ignore
          retention-days: 7
