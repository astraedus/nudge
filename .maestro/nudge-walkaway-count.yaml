# nudge-walkaway-count.yaml — three delayed launches, each declined with
# "I changed my mind". The runner reads the dashboard's week summary before and after
# and asserts BOTH counters moved by exactly +3.
#
# Why the runner reads the number instead of this flow asserting it: Maestro can assert
# that a string is present, but the assertion that matters here is arithmetic on a value
# the run itself changes, and a flow cannot carry a number between two invocations. The
# runner regexes "<n> blocked · <m> walked away" (ui/screens/home/HomeScreen.kt), which
# is ONE node — the "Blocked" stat tile renders its label and its value as separate
# semantics nodes, and a second tile carries the same label, so the tile is the wrong
# anchor even though it is the more obvious one.
#
# +3 on BOTH counters is the real contract: "Blocked" counts confrontations SHOWN and
# "Walked Away" counts the ones declined, so a decline must move both exactly once
# (HomeViewModel's KDoc — the raw `wasBlocked` count used to double-count a walk-away).
appId: com.google.android.youtube
---
# Home first: a live passthrough grant from an earlier completed countdown would let the
# first launch through unblocked, and this case counts BLOCKS.
- pressKey: Home
- extendedWaitUntil:
    visible: "Voice search"
    timeout: 15000
- repeat:
    times: 3
    commands:
      - launchApp:
          appId: "com.google.android.youtube"
          stopApp: false
      - extendedWaitUntil:
          visible: "I changed my mind"
          timeout: 30000
      - takeScreenshot: 30-walkaway-block
      - tapOn: "I changed my mind"
      - extendedWaitUntil:
          visible: "Voice search"
          timeout: 15000
      - takeScreenshot: 31-walkaway-home
