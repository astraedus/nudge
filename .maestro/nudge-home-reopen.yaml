# nudge-home-reopen.yaml — issue #58: a trip HOME must revoke the passthrough the
# countdown just granted, so re-opening the app meets the block again.
#
# The bug this pins was a RACE, so one green trial proves nothing; the runner repeats it
# (TRIALS, default 5) and additionally greps the logcat capture for
# `sitting ended … cause=WENT_HOME` once per trial and for any
# `block overlay launch dropped … DROP_FOREGROUND_MOVED` that was never followed by
# `re-evaluating a dropped block`. A flow that passes while those counts disagree is a
# flow that got lucky.
#
# `stopApp: false` on every launch is load-bearing: the reported scenario is RESUMING
# YouTube from the launcher, not cold-starting it. A force-stop would test a different
# code path (and an easier one).
appId: com.google.android.youtube
---
# Start from the launcher so trial 1 begins from the same state as trials 2..N: a completed
# countdown leaves a PASSTHROUGH grant that survives a force-stop, and only leaving to Home
# revokes it.
- pressKey: Home
- extendedWaitUntil:
    visible: "Voice search"
    timeout: 15000
- repeat:
    times: ${TRIALS}
    commands:
      # ── 1. open, meet the block, let the countdown through ──
      - launchApp:
          appId: "com.google.android.youtube"
          stopApp: false
      - extendedWaitUntil:
          visible: "I changed my mind"
          timeout: 30000
      - takeScreenshot: 20-trial-first-block
      - extendedWaitUntil:
          notVisible: "I changed my mind"
          timeout: 40000

      # ── 2. use the app for a few seconds ──
      # YouTube's feed animates continuously, so waitForAnimationToEnd spends its whole
      # timeout here — a real dwell that costs no CPU on the laptop (unlike a busy-wait).
      - waitForAnimationToEnd:
          timeout: 5000

      # ── 3. go home ──
      - pressKey: Home
      - extendedWaitUntil:
          visible: "Voice search"
          timeout: 15000
      - takeScreenshot: 21-trial-home

      # ── 4. re-open it. THIS is the assertion. ──
      - launchApp:
          appId: "com.google.android.youtube"
          stopApp: false
      - extendedWaitUntil:
          visible: "I changed my mind"
          timeout: 30000
      - takeScreenshot: 22-trial-reblocked

      # ── 5. leave the device in the state the next trial expects ──
      # Walking away revokes the grant, so trial N+1 starts from the same place as
      # trial 1. (A step that assumes its predecessor left the right screen is how a
      # suite grows an order dependency it cannot see.)
      - tapOn: "I changed my mind"
      - extendedWaitUntil:
          visible: "Voice search"
          timeout: 15000
