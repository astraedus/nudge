# nudge-delay-block.yaml — the signature feature: a DELAY rule really gates the app,
# and the countdown really lets it through afterwards.
#
# Anchors: "I changed my mind" (ui/overlay/DelayContent.kt) is the one string unique to
# the delay overlay — the hard-block screen says "Go Back" instead. The headline and
# subtitle are drawn at random from `NudgeMessages.delayTitles` / `.delaySubtitles`, so
# they are NOT assertable; the app label and that button are.
appId: com.google.android.youtube
---
# START FROM HOME, always. A completed countdown GRANTS PASSTHROUGH for the app, and that
# grant survives a force-stop-and-relaunch — the service logs
# `skip evaluation package=com.google.android.youtube reason=passthrough` and the app opens
# free. Only leaving to the launcher revokes it (that is issue #58's whole subject). So a
# case that expects a block and does not first go Home is asserting on the previous case's
# leftovers, and will fail for a reason that has nothing to do with the build.
- pressKey: Home
- extendedWaitUntil:
    visible: "Voice search"
    timeout: 15000
- launchApp:
    appId: "com.google.android.youtube"
    stopApp: true

# The overlay is a separate activity launched by the accessibility service, so it can
# take a moment after the target window appears. Poll, never a fixed wait.
- extendedWaitUntil:
    visible: "I changed my mind"
    timeout: 30000
- assertVisible: "YouTube"
- takeScreenshot: 10-delay-overlay

# Wait the countdown out rather than sleeping a guessed number of seconds: the overlay
# disappearing IS the completion signal, and `DelayContent` only ticks while it is on
# screen (issue #8), so a wall-clock sleep would be the wrong model anyway.
- extendedWaitUntil:
    notVisible: "I changed my mind"
    timeout: 40000
- takeScreenshot: 11-after-countdown

# That YouTube specifically is now in front is asserted by the RUNNER, from
# `dumpsys activity activities | mResumedActivity`. Deliberate: every string in
# YouTube's own a11y tree belongs to a third party that ships a new build weekly, and a
# release gate must not fail because Google moved a tab label.
