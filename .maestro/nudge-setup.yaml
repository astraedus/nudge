# nudge-setup.yaml — first-run walk + QA fixtures. Run by `scripts/device-qa.sh setup`.
#
# The runner has already done the parts a UI flow cannot do reliably:
#   `pm clear` (so this really is a first run), the OS-level accessibility /
#   SYSTEM_ALERT_WINDOW / GET_USAGE_STATS grants, and pushing
#   `.maestro/fixtures/rules.json` to /sdcard/Download/nudge-qa-rules.json.
#
# Two things here are load-bearing and easy to "tidy" into breakage:
#
#  1. `hideKeyboard` before tapping a search result. Gboard's suggestion strip sits
#     over the result list, and its completion chip carries the SAME text as the app
#     row — the tap lands on the suggestion, which rewrites the query and empties the
#     list. Searching by a PREFIX ("Calcul", not "Calculator") is the other half: the
#     search field's own text is a node too, and a full-name query makes the field
#     itself the first match for the app name.
#
#  2. Rules come from an IMPORTED FIXTURE, not from the rule editor. Every switch on
#     the config screen is a Compose `Switch` with no text of its own, so no
#     element-based selector can reach it (`rightOf` a label finds the InfoButton, and
#     coordinates are banned here). The importer is a real user-facing path, it takes
#     the exact field values the cases need (delaySeconds=5, dailyLimitMinutes=1),
#     and duplicate rules are skipped — so this is idempotent.
appId: dev.astraedus.nudge
---
# ─── Onboarding: three pages, Next / Next / Get Started ───────────────────────
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Mindful app usage through gentle friction"
    timeout: 30000
- takeScreenshot: 01-onboarding-welcome
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Permissions"
    timeout: 15000
- takeScreenshot: 02-onboarding-permissions
# The three "Grant Permission" buttons open system Settings screens. Deliberately NOT
# tapped: the grants are already in place at OS level, and driving the system
# accessibility list is the one step that is genuinely not deterministic.
- tapOn: "Next"
- extendedWaitUntil:
    visible: "You're all set"
    timeout: 15000
- takeScreenshot: 03-onboarding-ready
- tapOn: "Get Started"
- extendedWaitUntil:
    visible: "Screen Time"
    timeout: 20000
- takeScreenshot: 04-home

# ─── Developer Options → Debug Logging ────────────────────────────────────────
# On a RELEASE build `NudgeLogger` emits nothing unless this preference is on
# (util/NudgeLogger.kt: `BuildConfig.DEBUG || debugLoggingPreferenceEnabled`), and the
# home-reopen case asserts on those log lines. `pm clear` wipes the preference, so it
# is re-armed here on every setup rather than assumed.
- scrollUntilVisible:
    element:
      text: "Settings"
    direction: DOWN
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Import backup"
    direction: DOWN
- tapOn: "Import backup"
# ACTION_OPEN_DOCUMENT filtered to JSON opens DocumentsUI on Recent, where the file the runner
# just pushed is listed by name. Tapping by NAME means the ordering of that list does not matter.
- extendedWaitUntil:
    visible: "nudge-qa-rules.json"
    timeout: 30000
- takeScreenshot: 06-document-picker
- tapOn: "nudge-qa-rules.json"
- extendedWaitUntil:
    visible: "Import"
    timeout: 20000
- takeScreenshot: 07-import-preview
- tapOn: "Import"
- extendedWaitUntil:
    visible: "Import Complete"
    timeout: 25000
- takeScreenshot: 08-import-complete
- tapOn: "OK"

# ─── Developer Options → Debug Logging ────────────────────────────────────────
# Done AFTER the import, and that order is load-bearing: the Backup rows sit ABOVE the
# Version row in Settings, and Developer Options is appended BELOW both. Doing the developer
# taps first leaves the list scrolled to its bottom, and the later
# `scrollUntilVisible … direction: DOWN` for "Import backup" then searches away from it — which
# passed on a release build only because the row happened to still be on screen, and failed on a
# debug build whose extra developer row pushed it out. One monotonic downward pass, no
# dependency on where a previous tap left the scroll.
- scrollUntilVisible:
    element:
      text: "Version"
    direction: DOWN
- repeat:
    times: 7
    commands:
      - tapOn: "Version"
# The Developer Options section is APPENDED below "Source Code & Feedback" and "License",
# i.e. off-screen at the moment it appears — `assertVisible` on it fails on a screen where
# the taps worked perfectly. Scroll to the row we actually need.
- scrollUntilVisible:
    element:
      text: "Debug Logging"
    direction: DOWN
- tapOn: "Debug Logging"
- takeScreenshot: 05-debug-logging

# ─── Prove the fixtures actually landed ───────────────────────────────────────
# `ActiveRulesViewModel.buildSummaryText` renders a rule as "Delay 5s" and
# "Not blocked · 1min limit". Asserting those strings checks the VALUES the later cases
# depend on, not merely that an import dialog said success.
- pressKey: Back
# "Nudge" is the Home top-bar title, so it is the right anchor here: Compose Navigation
# restores Home's SCROLL POSITION, and we scrolled down to reach Settings — anything
# further up the dashboard (e.g. "Screen Time") is legitimately off-screen on return.
- extendedWaitUntil:
    visible: "Nudge"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Manage"
    direction: UP
- tapOn: "Manage"
- extendedWaitUntil:
    visible: "Active Rules"
    timeout: 15000
- assertVisible: "YouTube"
- assertVisible: "Delay 5s"
- assertVisible: "Calculator"
- assertVisible: "Not blocked · 1min limit"
- takeScreenshot: 09-active-rules
- pressKey: Back
